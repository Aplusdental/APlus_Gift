<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A+ Dental Center</title>
    <!-- Tajawal Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-navy: #030d1c;
            --card-navy: #0a192f;
            --cyan-accent: #22d3ee;
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
            --border-color: rgba(34, 211, 238, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-navy);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: var(--card-navy);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(34, 211, 238, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
        }

        .lock-btn {
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid var(--border-color);
            color: var(--cyan-accent);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lock-btn:hover {
            background: var(--cyan-accent);
            color: var(--bg-navy);
            transform: scale(1.05);
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-wrapper {
            width: 95px;
            height: 95px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cyan-accent), #0284c7);
            padding: 3px;
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.3);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: var(--card-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: var(--cyan-accent);
        }

        .clinic-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-white);
            margin-bottom: 6px;
        }

        .clinic-subtitle {
            font-size: 13px;
            color: var(--text-gray);
            line-height: 1.5;
        }

        /* Working Hours Badge */
        .hours-badge {
            background: rgba(34, 211, 238, 0.06);
            border: 1px dashed var(--cyan-accent);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--cyan-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Action Buttons */
        .actions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-white);
            font-weight: 600;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            border-color: var(--cyan-accent);
            transform: translateY(-2px);
            background: rgba(34, 211, 238, 0.08);
        }

        .action-btn svg {
            flex-shrink: 0;
        }

        .btn-whatsapp { border-right: 4px solid #25D366; }
        .btn-location { border-right: 4px solid #EA4335; }
        .btn-review   { border-right: 4px solid #FBBC05; }
        .btn-facebook { border-right: 4px solid #1877F2; }
        .btn-instagram{ border-right: 4px solid #E4405F; }
        .btn-tiktok   { border-right: 4px solid #EE1D52; }

        /* Modal / Admin Panel */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(3, 13, 28, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-navy);
            border: 1px solid var(--cyan-accent);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--cyan-accent);
            margin-bottom: 16px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-gray);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--cyan-accent);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-save, .btn-close {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-save {
            background: var(--cyan-accent);
            color: var(--bg-navy);
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-white);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="lock-btn" id="openAdminBtn" title="لوحة التحكم">
                🔒
            </button>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="logo-wrapper">
                <div class="logo-img" id="logoDisplay">A+</div>
            </div>
            <h1 class="clinic-title" id="titleDisplay">A+ Dental Center</h1>
            <p class="clinic-subtitle" id="subtitleDisplay">مركز A+ لطب وتجميل الأسنان - أحدث التقنيات لرعاية ابتسامتك</p>
        </div>

        <!-- Working Hours -->
        <div class="hours-badge">
            <span>🕒</span>
            <span id="hoursDisplay">يومياً من 11:00 صباحاً حتى 12:00 منتصف الليل (عدا الجمعة)</span>
        </div>

        <!-- Actions -->
        <div class="actions-list">
            <a id="whatsappLink" href="#" target="_blank" class="action-btn btn-whatsapp">
                <svg width="22" height="22" fill="#25D366" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                <span>حجز موعد عبر WhatsApp</span>
            </a>

            <a id="locationLink" href="#" target="_blank" class="action-btn btn-location">
                <svg width="22" height="22" fill="#EA4335" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span>موقع العيادة على الخريطة</span>
            </a>

            <a id="reviewLink" href="#" target="_blank" class="action-btn btn-review">
                <svg width="22" height="22" fill="#FBBC05" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                <span>تقييم العيادة على Google</span>
            </a>

            <a id="facebookLink" href="#" target="_blank" class="action-btn btn-facebook">
                <svg width="22" height="22" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                <span>صفحة الفيسبوك</span>
            </a>

            <a id="instagramLink" href="#" target="_blank" class="action-btn btn-instagram">
                <svg width="22" height="22" fill="#E4405F" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                <span>حساب Instagram</span>
            </a>

            <a id="tiktokLink" href="#" target="_blank" class="action-btn btn-tiktok">
                <svg width="22" height="22" fill="#EE1D52" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-5.2-1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V5.8a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 3 12a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.38a8.27 8.27 0 0 0 4.84 1.55V6.48a4.85 4.85 0 0 1-1-.21z"/></svg>
                <span>حساب TikTok</span>
            </a>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 class="modal-title">تعديل بيانات العيادة</h2>
            
            <div class="input-group">
                <label>اسم المركز:</label>
                <input type="text" id="adminTitle">
            </div>

            <div class="input-group">
                <label>الوصف / الوظيفة:</label>
                <input type="text" id="adminSubtitle">
            </div>

            <div class="input-group">
                <label>مواعيد العمل:</label>
                <input type="text" id="adminHours">
            </div>

            <div class="input-group">
                <label>رقم واتساب (بدون +):</label>
                <input type="text" id="adminWhatsapp" placeholder="2010XXXXXXXX">
            </div>

            <div class="input-group">
                <label>رابط الخريطة (Google Maps):</label>
                <input type="text" id="adminLocation">
            </div>

            <div class="input-group">
                <label>رابط التقييم (Google Review):</label>
                <input type="text" id="adminReview">
            </div>

            <div class="input-group">
                <label>رابط Facebook:</label>
                <input type="text" id="adminFacebook">
            </div>

            <div class="input-group">
                <label>رابط Instagram:</label>
                <input type="text" id="adminInstagram">
            </div>

            <div class="input-group">
                <label>رابط TikTok:</label>
                <input type="text" id="adminTiktok">
            </div>

            <div class="input-group">
                <label>تغيير كلمة سر اللوحة:</label>
                <input type="password" id="adminPass" placeholder="كلمة السر الجديدة">
            </div>

            <div class="modal-buttons">
                <button class="btn-save" id="saveAdminBtn">حفظ التعديلات</button>
                <button class="btn-close" id="closeAdminBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // Default Config Data
        const defaultConfig = {
            title: "A+ Dental Center",
            subtitle: "مركز A+ لطب وتجميل الأسنان - أحدث التقنيات لرعاية ابتسامتك",
            hours: "يومياً من 11:00 صباحاً حتى 12:00 منتصف الليل (عدا الجمعة)",
            whatsapp: "201000000000",
            location: "https://maps.google.com",
            review: "https://search.google.com/local/writereview?placeid=ChIJSSEBbgCr9xQRB4ZlYLghEEo",
            facebook: "https://www.facebook.com/aplusdentalcenter",
            instagram: "https://www.instagram.com/aplus.77",
            tiktok: "https://www.tiktok.com/@aplus.77",
            adminPass: "Aplus2026"
        };

        // Load Config from LocalStorage
        function getConfig() {
            const saved = localStorage.getItem('aplus_config');
            return saved ? JSON.parse(saved) : defaultConfig;
        }

        // Apply Data to UI
        function renderUI() {
            const config = getConfig();
            
            document.getElementById('titleDisplay').innerText = config.title;
            document.getElementById('subtitleDisplay').innerText = config.subtitle;
            document.getElementById('hoursDisplay').innerText = config.hours;

            document.getElementById('whatsappLink').href = `https://wa.me/${config.whatsapp}`;
            document.getElementById('locationLink').href = config.location;
            document.getElementById('reviewLink').href = config.review;
            document.getElementById('facebookLink').href = config.facebook;
            document.getElementById('instagramLink').href = config.instagram;
            document.getElementById('tiktokLink').href = config.tiktok;
        }

        // Open Admin Panel
        document.getElementById('openAdminBtn').addEventListener('click', () => {
            const config = getConfig();
            const passInput = prompt("أدخل كلمة السر لدخول لوحة التحكم:");
            
            if (passInput === config.adminPass) {
                document.getElementById('adminTitle').value = config.title;
                document.getElementById('adminSubtitle').value = config.subtitle;
                document.getElementById('adminHours').value = config.hours;
                document.getElementById('adminWhatsapp').value = config.whatsapp;
                document.getElementById('adminLocation').value = config.location;
                document.getElementById('adminReview').value = config.review;
                document.getElementById('adminFacebook').value = config.facebook;
                document.getElementById('adminInstagram').value = config.instagram;
                document.getElementById('adminTiktok').value = config.tiktok;
                document.getElementById('adminPass').value = config.adminPass;

                document.getElementById('adminModal').style.display = 'flex';
            } else if (passInput !== null) {
                alert("كلمة السر غير صحيحة!");
            }
        });

        // Close Admin Panel
        document.getElementById('closeAdminBtn').addEventListener('click', () => {
            document.getElementById('adminModal').style.display = 'none';
        });

        // Save Admin Data
        document.getElementById('saveAdminBtn').addEventListener('click', () => {
            const updatedConfig = {
                title: document.getElementById('adminTitle').value,
                subtitle: document.getElementById('adminSubtitle').value,
                hours: document.getElementById('adminHours').value,
                whatsapp: document.getElementById('adminWhatsapp').value,
                location: document.getElementById('adminLocation').value,
                review: document.getElementById('adminReview').value,
                facebook: document.getElementById('adminFacebook').value,
                instagram: document.getElementById('adminInstagram').value,
                tiktok: document.getElementById('adminTiktok').value,
                adminPass: document.getElementById('adminPass').value || "Aplus2026"
            };

            localStorage.setItem('aplus_config', JSON.stringify(updatedConfig));
            renderUI();
            document.getElementById('adminModal').style.display = 'none';
            alert("تم حفظ التغييرات بنجاح!");
        });

        // Initial Render
        renderUI();
    </script>
</body>
</html>
